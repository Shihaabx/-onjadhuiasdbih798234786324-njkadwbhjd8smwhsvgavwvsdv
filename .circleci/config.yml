# Windows Server 2022 RDP troubleshooting through a private Tailscale network.
# This is a temporary CI job, not a permanent cloud desktop.
# Add TAILSCALE_AUTHKEY and RDP_PASSWORD in CircleCI Project Settings > Environment Variables.
version: 2.1

jobs:
  windows-rdp:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Secure temporary Windows RDP over Tailscale
          command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .circleci/rdp.ps1
          no_output_timeout: 5m

workflows:
  windows-rdp:
    jobs:
      - windows-rdp
